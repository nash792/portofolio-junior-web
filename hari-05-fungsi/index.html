<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hitung statistik nilai dengan rata-rata, nilai tertinggi, dan nilai terendah."
    />
    <title>Statistik Nilai | Latihan Fungsi</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #172033;
        background: #f4f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 2rem 1.25rem;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 12% 8%, #dceaff 0, transparent 34rem),
          radial-gradient(ellipse at 90% 92%, #e8e1ff 0, transparent 30rem),
          #f4f7fb;
      }

      main {
        width: min(100%, 540px);
        padding: clamp(1.5rem, 6vw, 2.75rem);
        overflow: hidden;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(224, 231, 241, 0.9);
        border-radius: 24px;
        box-shadow:
          0 24px 70px rgba(36, 53, 84, 0.1),
          0 3px 10px rgba(36, 53, 84, 0.04);
      }

      .label-atas {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
        color: #5268d9;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .label-atas::before {
        width: 0.5rem;
        height: 0.5rem;
        content: "";
        background: #6477ed;
        border-radius: 50%;
        box-shadow: 0 0 0 4px #edf0ff;
      }

      h1 {
        margin: 0;
        color: #172033;
        font-size: clamp(1.9rem, 6vw, 2.5rem);
        letter-spacing: -0.055em;
        line-height: 1.1;
      }

      .deskripsi {
        margin: 0.85rem 0 2rem;
        color: #667085;
        font-size: 0.98rem;
        line-height: 1.65;
      }

      .form-nilai {
        padding: 1.25rem;
        background: #f7f8fc;
        border: 1px solid #e9edf5;
        border-radius: 16px;
      }

      label {
        display: block;
        margin-bottom: 0.55rem;
        color: #27334a;
        font-size: 0.9rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 3.1rem;
        padding: 0.75rem 0.9rem;
        color: #172033;
        background: #fff;
        border: 1px solid #d9dfeb;
        border-radius: 10px;
        font: inherit;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      input::placeholder {
        color: #98a2b3;
      }

      input:focus-visible {
        outline: none;
        border-color: #6477ed;
        box-shadow: 0 0 0 4px rgba(100, 119, 237, 0.15);
      }

      .petunjuk {
        margin: 0.6rem 0 1rem;
        color: #7a8497;
        font-size: 0.8rem;
      }

      button {
        width: 100%;
        min-height: 3.1rem;
        padding: 0.75rem 1rem;
        color: #fff;
        background: linear-gradient(135deg, #586ce0, #7658d8);
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 7px 16px rgba(91, 103, 216, 0.22);
        transition:
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(91, 103, 216, 0.28);
      }

      button:focus-visible {
        outline: 3px solid rgba(100, 119, 237, 0.4);
        outline-offset: 3px;
      }

      .bagian-hasil {
        margin-top: 1.75rem;
      }

      .judul-hasil {
        margin: 0 0 0.75rem;
        color: #27334a;
        font-size: 0.92rem;
        font-weight: 750;
      }

      #hasil {
        display: grid;
        gap: 0.65rem;
        min-height: 4.5rem;
        padding: 1rem;
        background: #fff;
        border: 1px solid #e9edf5;
        border-radius: 14px;
      }

      #hasil p {
        margin: 0;
        padding: 0.7rem 0.8rem;
        color: #44516a;
        background: #f7f8fc;
        border-radius: 9px;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      #hasil p:first-child {
        color: #4556bd;
        background: #f0f2ff;
        font-weight: 700;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="label-atas">Latihan fungsi JavaScript</span>
      <h1>Statistik nilai</h1>
      <p class="deskripsi">
        Masukkan beberapa nilai untuk melihat rata-rata, nilai tertinggi, dan
        nilai terendah secara langsung.
      </p>

      <div class="form-nilai">
        <label for="nilai">Daftar nilai</label>
        <input
          id="nilai"
          type="text"
          inputmode="decimal"
          value="80, 65, 90, 72"
          placeholder="Contoh: 80, 65, 90"
          autocomplete="off"
        />
        <p class="petunjuk">Pisahkan setiap nilai dengan tanda koma.</p>
        <button id="hitung" type="button">Hitung statistik</button>
      </div>

      <section class="bagian-hasil" aria-labelledby="judul-hasil">
        <h2 class="judul-hasil" id="judul-hasil">Hasil perhitungan</h2>
        <div id="hasil" aria-live="polite" aria-atomic="true">
          <p>Hasil statistik akan tampil di sini.</p>
        </div>
      </section>
    </main>
    <script type="module" src="./hari-05-modul/app.js"></script>
  </body>
</html>
