<!doctype html>
<html>
  <head>
    <title>Welcome to Bali</title>

    <style>
      .gambar {
        width: 720px;
        height: 360px;
        position: relative;
        display: flex;
        align-items: center;
        overflow: hidden;
      }

      .gambar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
      }

      p {
        color: #ffffff;
        font-size: 50px;
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="gambar">
      <img src="bali.jpg" alt="Welcome to Bali" />
      <p>Welcome to Bali</p>
    </div>
  </body>
</html>
