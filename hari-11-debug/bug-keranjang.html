<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 1 - Debugging JavaScript</title>
  </head>
  <body>
    <h2>Program Keranjang Belanja</h2>

    <div id="hasil"></div>

    <script>
      const keranjang = [
        { nama: "Buku", harga: 25000, jumlah: 2 },
        { nama: "Pensil", harga: 3000, jumlah: 10 },
        { nama: "Penghapus", harga: 2000, jumlah: 1 },
      ];

      function hitungSubtotal(item) {
        return item.harga * item.jumlah;
      }

      function hitungTotal(daftar) {
        let total = 0;

        for (let i = 0; i < daftar.length; i++) {
          total += hitungSubtotal(daftar[i]);
        }

        return total;
      }

      function hitungDiskon(total) {
        if (total >= 50000) {
          return total * 0.1;
        }
        return 0;
      }

      function formatRupiah(angka) {
        return "Rp" + angka.toLocaleString("id-ID");
      }

      const total = hitungTotal(keranjang);
      const diskon = hitungDiskon(total);
      const bayar = total - diskon;

      document.getElementById("hasil").innerHTML = `
            <p>Total belanja: ${formatRupiah(total)}</p>
            <p>Diskon: ${formatRupiah(diskon)}</p>
            <h3>Total bayar: ${formatRupiah(bayar)}</h3>
        `;

      console.log("Total belanja:", formatRupiah(total));
      console.log("Diskon:", formatRupiah(diskon));
      console.log("Total bayar:", formatRupiah(bayar));
    </script>
  </body>
</html>
